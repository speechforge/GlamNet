# Local IndicMFA resources for the offline five-language Vocos project.
#
# Source repo already exists at:
#   /home/linux/Documents/ravi_phd/Streaming_vocoder_with_prabhuji/vocos/IndicMFA
# Do not clone or download again unless one of these local files fails an integrity check.
#
# IndicMFA is G2G/letter-wise. Treat TextGrid intervals from these aligners as
# grapheme_id unless a separate validated phone-level alignment exists.

schema_version: 1
source_repository:
  url: https://github.com/AI4Bharat/IndicMFA.git
  local_path: /home/linux/Documents/ravi_phd/Streaming_vocoder_with_prabhuji/vocos/IndicMFA
  observed_commit: 6b4b9d811f61e99aff85c63df02a16f7e6e9aa02
  release_index_url: https://github.com/AI4Bharat/IndicMFA/releases
  method: existing_clone_only

mfa_usage:
  align_template: >
    mfa align --clean --use_mp --use_threading -j ${JOBS}
    --no_textgrid_cleanup --temporary_directory ${MFA_TEMP_DIR}
    ${CORPUS_LANGUAGE_DIR} ${DICTIONARY_PATH} ${ACOUSTIC_MODEL_PATH}
    ${OUTPUT_TEXTGRID_DIR}
  corpus_structure: corpus/<language>/<speaker_id>/<utterance>.wav_and_lab
  language_directory_policy: language_directories_are_not_speakers
  label_semantics: grapheme_to_grapheme_letter_alignment

